<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-theme-pref="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>sensors-view · login</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sensors-view.theme") || "dark";
        var resolved = t === "light" || t === "dark"
          ? t
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        var root = document.documentElement;
        root.dataset.theme = resolved;
        root.dataset.themePref = t === "system" || t === "dark" || t === "light" ? t : "dark";
        root.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute("content", resolved);
        var loc = localStorage.getItem("sensors-view.locale") || "zh";
        if (loc !== "zh" && loc !== "en") loc = "zh";
        root.lang = loc === "zh" ? "zh-CN" : "en";
      } catch (e) { /* ignore */ }
    })();
  </script>
  <style>
    /* Critical boot CSS — no network; prevents black→white flash before stylesheets */
    html, body {
      margin: 0;
      background: #0b1018;
      color: #e7ecf3;
      color-scheme: dark;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    .auth-boot, .login-boot-host {
      min-height: 100vh;
      background: #0b1018;
      color: #8b9bb4;
    }
  </style>
  <link rel="stylesheet" href="/static/fonts.css?v=64" />
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=64" />
  <link rel="stylesheet" href="/static/login.css?v=64" />
</head>
<body class="login-boot-host">
  <div id="auth-boot" class="auth-boot" role="status" aria-live="polite">
    <div class="auth-boot-mark" aria-hidden="true"></div>
    <p data-i18n="login.checkingSession">正在校验会话…</p>
  </div>

  <div id="login-root" class="login-page" hidden>
    <div class="login-bg" aria-hidden="true">
      <div class="login-grid"></div>
      <div class="login-orb login-orb-a"></div>
      <div class="login-orb login-orb-b"></div>
      <div class="login-scan"></div>
    </div>

    <header class="login-brand">
      <img src="/static/assets/favicon.svg" alt="" width="48" height="48" class="login-logo" />
      <span class="login-brand-name">sensors-view</span>
      <div class="login-lang" id="locale-seg" role="group" data-i18n="locale.aria" data-i18n-attr="aria-label" aria-label="界面语言">
        <button type="button" class="login-lang-btn" data-locale="zh" data-i18n="locale.zh">中文</button>
        <button type="button" class="login-lang-btn" data-locale="en" data-i18n="locale.en">English</button>
      </div>
    </header>

    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-card-shine" aria-hidden="true"></div>
        <h1 id="login-title" data-i18n="login.title">登录到 sensors-view</h1>
        <p class="login-sub" data-i18n="login.sub">使用本机账号继续</p>
        <form class="login-form" id="login-form" autocomplete="on">
          <label class="login-field">
            <span data-i18n="login.username">用户名</span>
            <input name="username" id="login-user" autocomplete="username" autofocus required />
          </label>
          <label class="login-field">
            <span class="login-field-row">
              <span data-i18n="login.password">密码</span>
              <button type="button" class="login-ghost" id="login-toggle-pw" tabindex="-1" data-i18n="login.show">显示</button>
            </span>
            <input name="password" id="login-pass" type="password" autocomplete="current-password" required />
          </label>
          <div class="login-error" id="login-error" role="alert" hidden></div>
          <button type="submit" class="login-submit" id="login-submit" data-i18n="login.submit">登录</button>
        </form>
      </section>
      <aside class="login-aside">
        <p id="login-aside" data-i18n="login.aside">默认用户 sensors（可通过环境变量覆盖）</p>
        <p class="login-aside-muted" data-i18n="login.asideMuted">会话 Cookie · 7 天 · HttpOnly</p>
      </aside>
    </main>

    <footer class="login-footer">
      <span>sensors-view</span>
      <span class="login-footer-dot" aria-hidden="true">·</span>
      <span data-i18n="login.footerTag">现场传感器控制台</span>
    </footer>
  </div>

  <script src="/static/i18n.js?v=64"></script>
  <script src="/static/appearance.js?v=64"></script>
  <script src="/static/login.js?v=64"></script>
</body>
</html>
